# =============================================================================
#  EPG Turkiye Guncelle (VPN)
# -----------------------------------------------------------------------------
#  NEDEN BU DOSYA VAR
#  Eski is akisi her gun yesil calisiyordu ama yalnizca 122 kanala program
#  getirebiliyordu. Sebep olculdu (14-15.09.2026): Turk operatorleri yurtdisi
#  isteklere cevap vermiyor. Ayni cekim Turkiye'den yapilinca 152 kanal geldi.
#
#  KANIT - Digiturk ayni adres, ayni istek:
#      Istanbul cikisi : HTTP 200
#      Kiyv cikisi     : HTTP 403
#  Yani engel ULKEYE gore. Ve bir VPN sunucusu uzerinden gelen Turk IP'si
#  kabul ediliyor - yani GitHub'in sunucusu Turkiye uzerinden cikarsa is goruyor.
#
#  GIRIS MESELESI
#  AdGuard VPN komut satirinin kullanici-adi/sifre ile girisi YOK; tarayici
#  onayi istiyor. GitHub sunucusu ise her calismada sifirdan kurulur.
#  Cozum: oturum BIR KEZ acilir ve GitHub onbelleginde saklanir; gunluk
#  calismalar onu geri yukler. Her gun calistigi icin onbellek taze kalir.
#
#  EMNIYET KEMERI
#  Cekime baslamadan once Digiturk'e soruyoruz. 403 gelirse VPN Turk cikisi
#  vermiyor demektir ve is akisi ORADA durur - yarim rehberi iyisinin
#  uzerine yazmaz. Cekimden sonra da "programi olan kanal" sayisi esigin
#  altindaysa yine durur.
# =============================================================================

name: EPG Turkiye Guncelle (VPN)

on:
  schedule:
    - cron: '0 3 * * *'      # her gun 03:00 UTC (~06:00 TR)
  workflow_dispatch:
    inputs:
      giris_yenile:
        description: 'AdGuard girisini yenile (ilk kurulumda ve oturum bitince ISARETLE)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Bu sayinin ALTINDA kalirsa yayinlamayiz. Olculen degerler:
  #   VPN'siz GitHub = 122 ,  Turkiye'den = 152
  # 130 ikisini net ayirir.
  ASGARI_KANAL: 130

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Bu depoyu checkout et
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # AdGuard oturumu. Onbellekte varsa geri yuklenir; yoksa asagidaki
      # giris adimi devreye girer.
      # ---------------------------------------------------------------------
      # Onbellek anahtari her calismada FARKLI, geri yukleme ONEKLE yapiliyor.
      # Neden: GitHub sabit anahtarli bir onbellegi BIR KEZ yazar, sonra
      # bir daha guncellemez (anahtar isabet edince kaydetme adimi atlanir).
      # AdGuard oturum dosyasi tazelenince eski hali onbellekte cakili
      # kalirdi. Bu haliyle her calisma en yenisini alir ve kendi halini
      # geri yazar - oturum kendini yenileyebilir.
      # (Onbellek adimi asagiya, kurulumun ARDINA tasindi - bkz. #K51 notu.)

      - name: AdGuard VPN komut satirini kur
        run: |
          # -a y : kurulum betigi "/usr/local/bin'e kisayol olusturayim mi?"
          # diye soruyor ve cevabi /dev/tty'den okumaya calisiyor. GitHub
          # sunucusunda klavye yok, o yuzden ilk denemede patladi
          # ("cannot open /dev/tty"). -a y o soruyu pesinen cevaplar.
          curl -fsSL https://raw.githubusercontent.com/AdguardTeam/AdGuardVPNCLI/HEAD/scripts/release/install.sh \
            | sh -s -- -v -a y
          export PATH="$PATH:/opt/adguardvpn_cli"
          echo "/opt/adguardvpn_cli" >> $GITHUB_PATH
          adguardvpn-cli --version || /opt/adguardvpn_cli/adguardvpn-cli --version || true

      # ---------------------------------------------------------------------
      # #K51 (2026-10-16) SIRA DEGISTI: oturum onbellegi artik KURULUMDAN SONRA
      # geri yukleniyor. Kanit: 50 calismanin 50'sinde zamanlanmis calisma
      # "You are not logged in" ile dustu; elle giris yapilan her calisma
      # basarili. Basarisiz calismada oturum klasoru geri geliyordu
      # (cache_selector.dat, tunnel.log onceki gunun tarihini tasiyordu) ama
      # adguardvpn-cli.conf 281 bayt ve o calismanin saatinde yeniden
      # yazilmisti; giris yapilmis halinde 634 bayt. Yani kurulum/ilk calisma
      # kayitli oturumun uzerine yazmis olabilir. Kurulum once, geri yukleme
      # sonra olursa bu ihtimal ortadan kalkar.
      # ---------------------------------------------------------------------
      - name: AdGuard oturumunu onbellekten al
        id: oturum
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/adguardvpn-cli
            ~/.config/adguardvpn-cli
            ~/.adguardvpn-cli
          key: adguard-oturum-${{ github.run_id }}
          restore-keys: |
            adguard-oturum-

      - name: Oturum onbellek tanisi (dusurmez, deger YAZMAZ)
        run: |
          echo "onbellek tam isabet : ${{ steps.oturum.outputs.cache-hit }}"
          echo "eslesen anahtar     : ${{ steps.oturum.outputs.cache-matched-key }}"
          D=~/.local/share/adguardvpn-cli
          ls -la --time-style=full-iso "$D" 2>&1 | head -20
          echo "--- conf alanlari (yalniz ad ve uzunluk; degerler yazilmaz) ---"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser('~/.local/share/adguardvpn-cli/adguardvpn-cli.conf')
          try:
              raw = open(p).read()
          except Exception as e:
              print('okunamadi:', e)
              raise SystemExit
          print('boyut', len(raw))
          try:
              d = json.loads(raw)
              def kz(o, pre=''):
                  for k, v in o.items():
                      if isinstance(v, dict):
                          kz(v, pre + k + '.')
                      else:
                          print(' ', pre + k, type(v).__name__, len(str(v)))
              kz(d)
          except Exception:
              for l in raw.splitlines():
                  print(' ', l.split('=')[0].split(':')[0][:40], '(satir uzunlugu', len(l), ')')
          PY
          echo "--- geri yukleme hemen sonrasi durum ---"
          adguardvpn-cli status 2>&1 || true

      # ---------------------------------------------------------------------
      # GIRIS - yalnizca elle baslatildiginda ve kutu isaretliyken.
      # Bu adim ekrana bir bag basar ve bekler. Actions sayfasindaki CANLI
      # logda o bagi gorur, tarayicida acar, onaylarsin. Bir kez.
      # ---------------------------------------------------------------------
      - name: AdGuard girisi (elle, tek seferlik)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.giris_yenile }}
        timeout-minutes: 15
        run: |
          echo "=============================================================="
          echo " Asagida cikacak bagi TARAYICIDA ac ve onayla."
          echo " Onayladiktan sonra bu adim kendiliginden devam eder."
          echo "=============================================================="
          adguardvpn-cli login

      # TANI ADIMI - burasi is akisini ASLA dusurmez, sadece anlatir.
      # Onceki surumde burada bir metin aramasi vardi ve "giris yok" diye
      # yanlis karar verip turu 8 saniyede oldurebiliyordu. Artik karari
      # bir sonraki adim (baglanma) veriyor: giris yoksa zaten o adim
      # kendi net hatasiyla duser. Burasi yalnizca oturumun NEREDE
      # durdugunu kayda gecirir - bir daha ayni soruyu sormayalim diye.
      - name: AdGuard durumu (tani - dusurmez)
        run: |
          echo "--- status ---"
          adguardvpn-cli status 2>&1 || true
          echo "--- account ---"
          adguardvpn-cli account 2>&1 || true
          echo "--- olasi oturum klasorleri ---"
          for K in ~/.local/share/adguardvpn-cli ~/.config/adguardvpn-cli ~/.adguardvpn-cli; do
            if [ -d "$K" ]; then echo "VAR : $K"; ls -la "$K" | head -10; else echo "yok : $K"; fi
          done
          echo "--- /opt/adguardvpn_cli ---"
          sudo ls -la /opt/adguardvpn_cli 2>/dev/null | head -15 || true

      - name: Istanbul'a baglan
        run: |
          if ! adguardvpn-cli connect -l Istanbul 2>&1 && \
             ! adguardvpn-cli connect -l TR 2>&1; then
            echo "::error::Istanbul'a baglanilamadi. En olasi sebep: AdGuard"
            echo "::error::oturumu dusmus. COZUM: bu is akisini ELLE calistir"
            echo "::error::ve 'giris_yenile' kutusunu ISARETLE - canli logda"
            echo "::error::cikan bagi tarayicida onayla. Rehber DEGISMEDI."
            exit 1
          fi
          sleep 5
          adguardvpn-cli status 2>&1 || true

      # ---------------------------------------------------------------------
      # KANARYA. Olculmus ayirt edici: Digiturk Turkiye'den 200, disaridan 403.
      # ---------------------------------------------------------------------
      - name: Turk cikisi dogrula (Digiturk kanaryasi)
        run: |
          KOD=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            https://www.digiturk.com.tr/ || echo 000)
          echo "Digiturk yaniti: HTTP=$KOD"
          if [ "$KOD" != "200" ]; then
            echo "::error::VPN Turk cikisi vermiyor (Digiturk $KOD). Cekime girilmedi."
            echo "::error::Rehber DEGISTIRILMEDI - eldeki surum korundu."
            exit 1
          fi
          echo "Turk cikisi dogrulandi."

      - name: iptv-org/epg kaynak kodunu klonla
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari kur
        working-directory: epg-src
        run: npm ci

      # ---------------------------------------------------------------------
      # TV+ yamasi - yereldeki epg_tvplus_yama.ps1 ile ayni isi yapar.
      # (1) Dosyada sabit yazili sunucu kapali olabiliyor, ayakta olani bul.
      # (2) Giris istegi basarisiz olunca .catch undefined donduruyor ve
      #     sonraki satir "undefined.headers" diye patliyor - gercek sebebi
      #     gizliyor. Korumali hale getir.
      # ---------------------------------------------------------------------
      - name: TV+ site dosyasini yama
        working-directory: epg-src
        run: |
          CONF=sites/tvplus.com.tr/tvplus.com.tr.config.js
          if [ ! -f "$CONF" ]; then echo "Site dosyasi yok, atlandi."; exit 0; fi
          SECILEN=""
          for A in gbzottvsc12 gbzottvsc14 izmaottvsc13 izmaottvsc15 gbzottvsc13 izmaottvsc14; do
            K=$(curl -s -o /dev/null -w '%{http_code}' -k -m 8 -X POST \
              -H 'Content-Type: application/json' \
              -d '{"terminaltype":"webtv","osversion":"Win32","userType":"3","utcEnable":"1","timezone":"Europe/Istanbul"}' \
              "https://$A.tvplus.com.tr:33207/EPG/JSON/Authenticate" || echo 000)
            echo "  $A -> HTTP=$K"
            if [ "$K" != "000" ]; then SECILEN="$A"; break; fi
          done
          if [ -n "$SECILEN" ]; then
            sed -i "s/izmaottvsc14/$SECILEN/g" "$CONF"
            echo "TV+ sunucusu: $SECILEN"
          else
            echo "Ayakta TV+ sunucusu bulunamadi, dosya degistirilmedi."
          fi
          sed -i "s|response.headers\['set-cookie'\].join(';')|(response \&\& response.headers \&\& response.headers['set-cookie'] ? response.headers['set-cookie'].join(';') : '')|" "$CONF"

      # ---------------------------------------------------------------------
      # Cikarilan siteler ve nedenleri (olculdu):
      #   galamtv.kz    HTTP 404 - adres olmus
      #   teleboy.ch    HTTP 403
      #   tvprofil.com  HTTP 403 - Turkiye'den de reddediyor
      # Bu ucu 14 dakikanin buyuk kismini yiyip tek program getirmiyordu.
      # ---------------------------------------------------------------------
      - name: Turkce EPG verisini cek
        working-directory: epg-src
        run: >
          npm run grab --
          --sites=digiturk.com.tr,dsmart.com.tr,turksatkablo.com.tr,tvplus.com.tr,ipko.tv,melita.com,tv24.se,tvgids.nl,webtv.delta.nl,ziggogo.tv,tv.blue.ch
          --lang=tr
          --days=3
          --maxConnections=5
          --output=guide.xml
          --gzip

      - name: Sonucu say ve esigi kontrol et
        id: say
        run: |
          mkdir -p dist
          cp epg-src/guide.xml dist/guide-tr.xml
          cp epg-src/guide.xml.gz dist/guide-tr.xml.gz
          KANAL=$(grep -o '<channel id=' dist/guide-tr.xml | wc -l)
          PROGRAM=$(grep -o '<programme ' dist/guide-tr.xml | wc -l)
          DOLU=$(grep -o '<programme[^>]*channel="[^"]*"' dist/guide-tr.xml \
                 | sed 's/.*channel="\([^"]*\)".*/\1/' | sort -u | wc -l)
          echo "kanal tanimi        : $KANAL"
          echo "toplam program      : $PROGRAM"
          echo "programi olan kanal : $DOLU"
          echo "kanal=$KANAL"     >> $GITHUB_OUTPUT
          echo "program=$PROGRAM" >> $GITHUB_OUTPUT
          echo "dolu=$DOLU"       >> $GITHUB_OUTPUT
          if [ "$DOLU" -lt "${{ env.ASGARI_KANAL }}" ]; then
            echo "::error::Programi olan kanal $DOLU - esik ${{ env.ASGARI_KANAL }}."
            echo "::error::Yayinlanmadi; eldeki rehber korundu."
            exit 1
          fi

      - name: Manifest ve registry uret
        run: |
          HASH=$(sha256sum dist/guide-tr.xml.gz | awk '{print $1}')
          BOYUT=$(stat -c%s dist/guide-tr.xml.gz)
          ZAMAN=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > dist/manifest-tr.json <<EOF
          {
            "country": "tr",
            "language": "tr",
            "generated": "$ZAMAN",
            "channels": ${{ steps.say.outputs.kanal }},
            "channelsWithPrograms": ${{ steps.say.outputs.dolu }},
            "programmes": ${{ steps.say.outputs.program }},
            "sha256": "$HASH",
            "bytesGz": $BOYUT,
            "file": "guide-tr.xml.gz",
            "source": "github-vpn"
          }
          EOF
          cat > dist/registry.json <<EOF
          {
            "version": 1,
            "updated": "$ZAMAN",
            "guides": { "tr": { "manifest": "manifest-tr.json", "file": "guide-tr.xml.gz" } }
          }
          EOF
          echo "Son guncelleme (UTC): $ZAMAN" > dist/last-updated.txt
          cat dist/manifest-tr.json

      - name: Degisiklikleri commit'le ve gonder
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add dist/guide-tr.xml dist/guide-tr.xml.gz dist/manifest-tr.json dist/registry.json dist/last-updated.txt
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "EPG (VPN): ${{ steps.say.outputs.dolu }} kanal, $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: VPN baglantisini kes
        if: always()
        run: adguardvpn-cli disconnect || true
